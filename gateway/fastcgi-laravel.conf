###############################################################################
# gateway/fastcgi-laravel.conf — common FastCGI params for every location
# that forwards to business-agency-saas-api. Included from three places in
# nginx.conf.template: the general /api/ block, the unprefixed /up health
# route (Laravel 11's built-in `health:` route in bootstrap/app.php, which
# is NOT under the /api prefix), and the SSE chat-stream route.
###############################################################################

fastcgi_pass laravel_upstream;
fastcgi_index index.php;
include fastcgi_params;

fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME     /index.php;
fastcgi_param REQUEST_URI     $request_uri;
fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

# NPM already sets these; pass through as-is rather than overriding.
fastcgi_param HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;
fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
