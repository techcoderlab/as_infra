###############################################################################
# gateway/nginx.conf — as_infra internal router
# Tuned for a small container (0.50 CPU / 150M limit) sitting behind the
# remote NPM instance, not facing the internet directly.
###############################################################################

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 4096;

pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    # Logs to stdout/stderr — the host's /etc/docker/daemon.json already
    # rotates json-file logs (10 MB x 3), so no logrotate/cron is needed here.
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
