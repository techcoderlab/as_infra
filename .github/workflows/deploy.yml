###############################################################################
# .github/workflows/deploy.yml
#
# On every push to `main`:
#   1. Build gateway / api / tools images on GitHub's cloud runners (the
#      OptiPlex's i3-6100T has no spare CPU for Composer/npm-build work
#      alongside Jellyfin transcodes and the rest of this stack).
#   2. Push to GHCR, tagged `latest` and with the commit SHA.
#   3. Deploy job runs on a SELF-HOSTED runner installed directly on the
#      OptiPlex — confirmed as the preferred approach over direct SSH from
#      GitHub's cloud, specifically to avoid needing to port-forward SSH (or
#      any port) on your home router. The runner makes an outbound-only
#      connection to GitHub and polls for jobs; nothing calls in. UFW rules
#      stay exactly as they are (22 for LAN SSH, 8096, 8082, 139, 445, and
#      the new 8080 for the gateway).
#
# One-time setup: docs/Deployment-Operations-Checklist.md section 4.
#
# Required repository secrets:
#   AS_APP_KEY, AS_APP_URL, AS_FRONTEND_URL, AS_SCRIBE_AUTH_KEY,
#   POSTGRES_AS_USER_PASSWORD, REDIS_PASSWORD, LARAVEL_APP_SECRET
# (DOMAIN, POSTGRES_AS_DB, POSTGRES_AS_USER, LARAVEL_APP_ID,
#  ALLOWED_CALLBACK_DOMAINS aren't sensitive — fine as plain repo variables.)
###############################################################################

name: Build & Deploy as_infra

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: as_infra-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository_owner }}/as_infra

jobs:
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            context: .
            dockerfile: gateway/Dockerfile
          - service: api
            context: services/business-agency-saas-api
            dockerfile: services/business-agency-saas-api/Dockerfile
          - service: tools
            context: services/business-tools-service
            dockerfile: services/business-tools-service/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to OptiPlex
    needs: build
    runs-on: [self-hosted, optiplex]
    steps:
      # Deliberately NOT actions/checkout — that would check the repo out
      # into the runner's own separate _work/ directory, which would then
      # diverge from /opt/docker-data/source-code/as_infra (the path you
      # already cloned into manually, and the path every command in
      # docs/Deployment-Operations-Checklist.md assumes). This keeps ONE
      # canonical checkout that both manual operations and CI use.
      - name: Sync /opt/docker-data/source-code/as_infra to origin/main
        run: |
          cd /opt/docker-data/source-code/as_infra
          git fetch origin main
          git reset --hard origin/main
          git clean -fd -e infra/.env   # drop any stray untracked files, but never touch the real .env

      - name: Log in to GHCR
        # GHCR packages default to private when the repo is private —
        # `docker compose pull` below needs this or it 401s. This step was
        # missing from the first version of this workflow; without it the
        # very first CI-driven deploy fails at the pull step.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write infra/.env from repository secrets
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: |
          cat > .env <<EOF
          COMPOSE_PROJECT_NAME=as_infra
          DOMAIN=${{ vars.DOMAIN }}
          GATEWAY_PORT=8080
          GHCR_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
          IMAGE_TAG=${{ github.sha }}
          AS_APP_KEY=${{ secrets.AS_APP_KEY }}
          AS_APP_URL=${{ secrets.AS_APP_URL }}
          AS_FRONTEND_URL=${{ secrets.AS_FRONTEND_URL }}
          AS_SCRIBE_AUTH_KEY=${{ secrets.AS_SCRIBE_AUTH_KEY }}
          TRUSTED_PROXIES=*
          POSTGRES_AS_DB=${{ vars.POSTGRES_AS_DB }}
          POSTGRES_AS_USER=${{ vars.POSTGRES_AS_USER }}
          POSTGRES_AS_USER_PASSWORD=${{ secrets.POSTGRES_AS_USER_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          QUEUE_CONNECTION=redis
          TOOLS_PORT=8017
          LARAVEL_APP_ID=${{ vars.LARAVEL_APP_ID }}
          LARAVEL_APP_SECRET=${{ secrets.LARAVEL_APP_SECRET }}
          ALLOWED_CALLBACK_DOMAINS=${{ vars.ALLOWED_CALLBACK_DOMAINS }}
          MCP_SIDECAR_SERVICE_URL=http://business-tools-service:8017
          PHP_FPM_MAX_CHILDREN=14
          PHP_FPM_START_SERVERS=4
          PHP_FPM_MIN_SPARE_SERVERS=2
          PHP_FPM_MAX_SPARE_SERVERS=6
          PHP_FPM_MAX_REQUESTS=1000
          PHP_MEMORY_LIMIT=256M
          OPCACHE_MEMORY_MB=192
          EOF
          chmod 600 .env

      - name: Ensure host bind-mount directories exist
        run: |
          sudo mkdir -p /opt/docker-data/app-data/as_infra/{postgres,redis,tools/logs}
          sudo mkdir -p /opt/docker-data/app-data/as_infra/laravel/storage/{app,logs}
          sudo chown -R "$(id -u):$(id -g)" /opt/docker-data/app-data/as_infra

      - name: Pull new images
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: docker compose pull

      - name: Run database migrations (once, before recreating containers)
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: docker compose run --rm business-agency-saas-api php artisan migrate --force --no-interaction

      - name: Cache config/routes (once, same reasoning as migrations)
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: |
          docker compose run --rm business-agency-saas-api php artisan config:cache
          docker compose run --rm business-agency-saas-api php artisan route:cache

      - name: Recreate the stack with the new images
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: docker compose up -d --remove-orphans

      - name: Restart queue workers cleanly
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: |
          docker compose exec -T business-agency-saas-api php artisan queue:restart || true

      - name: Wait for health, then verify
        working-directory: /opt/docker-data/source-code/as_infra/infra
        run: |
          echo "Waiting for services to report healthy..."
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format json \
              | grep -o '"Health":"[a-z]*"' \
              | grep -vc '"Health":"healthy"\|"Health":""' || true)
            if [ "$unhealthy" -eq 0 ]; then
              echo "All services healthy."
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Prune old images
        run: docker image prune -f
